[package]
name = "coderadio"
version = "0.1.0"
edition = "2021"
description = "terminal player for freeCodeCamp Code Radio"
license = "MIT"
rust-version = "1.85"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ctrlc = "3.4"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
rodio = { version = "0.21", default-features = false, features = ["playback", "mp3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
