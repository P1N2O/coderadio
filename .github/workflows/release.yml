name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binary:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rust-cross/cargo-zigbuild:latest
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: coderadio-linux-x86_64
            alsa: host
            # Allow the distro libasound (which references newer glibc symbols
            # than zig's bundled glibc) to link dynamically.
            rustflags: -C link-arg=-Wl,--allow-shlib-undefined
          - target: aarch64-unknown-linux-gnu
            artifact: coderadio-linux-arm64
            alsa: arm64
            rustflags: -C link-arg=-Wl,--allow-shlib-undefined
          - target: x86_64-pc-windows-gnu
            artifact: coderadio-windows-x86_64.exe
          - target: aarch64-pc-windows-gnullvm
            artifact: coderadio-windows-arm64.exe
    steps:
      - uses: actions/checkout@v4

      - name: ALSA deps (Linux x86_64, host)
        if: matrix.alsa == 'host'
        run: |
          apt-get update
          apt-get install -y pkg-config libasound2-dev

      - name: ALSA deps (Linux arm64, cross)
        if: matrix.alsa == 'arm64'
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y pkg-config libasound2-dev:arm64

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          set -euo pipefail
          # The image keeps its tools under /usr/local/cargo/bin, which is not
          # on PATH for a login shell.
          export PATH="/usr/local/cargo/bin:$PATH"
          if [ "${{ matrix.alsa }}" = "arm64" ]; then
            export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
            export PKG_CONFIG_SYSROOT_DIR=/
          fi
          export PKG_CONFIG_ALLOW_SYSTEM_LIBS=1
          cargo zigbuild --release --target "${{ matrix.target }}"

      - name: Package binary
        run: |
          set -euo pipefail
          EXT=""
          case "${{ matrix.target }}" in *windows*) EXT=".exe";; esac
          cp "target/${{ matrix.target }}/release/coderadio$EXT" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # macOS binaries built natively with the Xcode SDK that a macOS runner
  # provides. Ships both per-arch binaries AND a universal (lipo) one.
  build-macos:
    name: macOS (arm64, x86_64, universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin

      - name: Package binaries
        run: |
          cp target/aarch64-apple-darwin/release/coderadio coderadio-macos-arm64
          cp target/x86_64-apple-darwin/release/coderadio   coderadio-macos-x86_64
          lipo -create \
            target/aarch64-apple-darwin/release/coderadio \
            target/x86_64-apple-darwin/release/coderadio \
            -output coderadio-macos-universal

      - uses: actions/upload-artifact@v4
        with:
          name: coderadio-macos
          path: |
            coderadio-macos-arm64
            coderadio-macos-x86_64
            coderadio-macos-universal

  # Assemble everything into a GitHub release.
  release:
    name: Publish release
    needs: [build-binary, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
